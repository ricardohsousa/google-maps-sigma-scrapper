# Usar junto de compose.yml. O conector alcança o desktop pela rede Docker.
services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/tunnel-token
    depends_on:
      desktop:
        condition: service_healthy
    secrets:
      - tunnel-token
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  tunnel-token:
    file: ${SIGMA_SECRETS_DIR:-./secrets}/tunnel-token
