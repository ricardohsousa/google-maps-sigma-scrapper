name: Deploy Sigma OCI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: sigma-oci-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build e smoke test
    runs-on: ${{ vars.OCI_ARCH == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
      arch: ${{ steps.reference.outputs.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependências dos testes sem instalar navegadores
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validar scripts e retorno em caso de falha
        run: |
          for script in deploy/desktop/*.sh deploy/web/*.sh; do bash -n "$script"; done
          node test/deploy-oci.test.js
          npm test
          SIGMA_OWNER_EMAIL=ci@example.com SIGMA_ACCESS_ISSUER=https://ci.cloudflareaccess.com SIGMA_ACCESS_AUD=ci docker compose -f deploy/web/compose.yml config --quiet
      - name: Definir arquitetura e imagem
        id: reference
        env:
          OCI_ARCH: ${{ vars.OCI_ARCH || 'arm64' }}
        run: |
          set -euo pipefail
          [[ "$OCI_ARCH" == arm64 || "$OCI_ARCH" == amd64 ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}/sigma-web:${GITHUB_SHA}"
          printf 'image=%s\narch=%s\n' "$image" "$OCI_ARCH" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar imagem
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/${{ steps.reference.outputs.arch }}
          push: true
          tags: ${{ steps.reference.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sigma-web-${{ steps.reference.outputs.arch }}
          cache-to: type=gha,mode=max,scope=sigma-web-${{ steps.reference.outputs.arch }}
      - name: Verificar servidor web e exigência de identidade
        env:
          SIGMA_IMAGE: ${{ steps.reference.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash deploy/web/smoke-image.sh "${SIGMA_IMAGE%:*}@${IMAGE_DIGEST}"
      - name: Fixar imagem pelo digest aprovado
        if: success()
        env:
          SIGMA_IMAGE: ${{ steps.reference.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "${SIGMA_IMAGE%:*}@${IMAGE_DIGEST}" > image-reference.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-image-reference
          path: image-reference.txt
          retention-days: 7

  deploy:
    name: Publicar na OCI
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: oci
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sigma-image-reference
      - name: Transferir release e executar deploy
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT || '22' }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          SIGMA_OWNER_EMAIL: ${{ secrets.SIGMA_OWNER_EMAIL }}
          SIGMA_ACCESS_ISSUER: ${{ secrets.SIGMA_ACCESS_ISSUER }}
          SIGMA_ACCESS_AUD: ${{ secrets.SIGMA_ACCESS_AUD }}
          SIGMA_CPUS: ${{ vars.SIGMA_CPUS || '1.0' }}
          SIGMA_MEMORY: ${{ vars.SIGMA_MEMORY || '3g' }}
          OCI_ARCH: ${{ needs.image.outputs.arch }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/web/deploy-action.sh
      - name: Resumo
        run: |
          printf 'Sigma web publicado na OCI. Validar Access e os dois perfis em https://sigma.ricardohenrique.com\n' >> "$GITHUB_STEP_SUMMARY"
